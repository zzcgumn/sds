# .github/workflows/ci_linux.yml
name: CI – Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The LLVM toolchain extracts to ~4 GB and dds is built from source on
      # every run, so the runner's default free space is not comfortable.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # The prebuilt LLVM 21.1.8 toolchain's ld.lld is dynamically linked
      # against libxml2.so.2, an ABI ubuntu-latest's current release no
      # longer ships under that name or soname (it is now libxml2-16,
      # providing libxml2.so.16) -- so there is no package left that
      # satisfies the old name, and a plain `apt-get install libxml2` 404s.
      # ld.lld only touches a tiny, stable slice of libxml2's API, so a
      # compat symlink to whatever libxml2.so.* the distro does ship is
      # enough to satisfy the dynamic loader.
      - name: Install libxml2 (required by the LLVM toolchain's ld.lld)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-16 || sudo apt-get install -y libxml2t64 || sudo apt-get install -y libxml2
          LIBXML2_PATH="$(ldconfig -p | grep -m1 'libxml2\.so' | awk '{print $NF}')"
          echo "Found: $LIBXML2_PATH"
          test -n "$LIBXML2_PATH"
          LIBXML2_DIR="$(dirname "$LIBXML2_PATH")"
          if [ ! -e "$LIBXML2_DIR/libxml2.so.2" ]; then
            sudo ln -s "$LIBXML2_PATH" "$LIBXML2_DIR/libxml2.so.2"
            sudo ldconfig
          fi

      - name: Build
        run: bazelisk build --verbose_failures //...

      - name: Test
        run: bazelisk test --verbose_failures --test_output=errors //...

      # The optimised build (-c opt plus -DNDEBUG). Its own step rather than
      # folded into the two above: an optimised build of this tree is a
      # different compilation, and nothing else here exercises --config=opt.
      # python/tests/ci_belief_evaluation_opt_test.py guards that these two
      # lines keep naming this module.
      - name: Build belief_evaluation (optimised)
        run: bazelisk build --config=opt --verbose_failures //src/belief_evaluation

      - name: Test belief_evaluation (optimised)
        run: bazelisk test --config=opt --verbose_failures --test_output=errors //tests/belief_evaluation/...

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bazel-testlogs-linux
          path: bazel-testlogs/**
          if-no-files-found: ignore
