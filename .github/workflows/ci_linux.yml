# .github/workflows/ci_linux.yml
name: CI – Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build_and_test:
    # Pinned, not ubuntu-latest: that label moved to "resolute" (26.04) and
    # broke this build two ways at once -- libxml2 dropped the .so.2 soname
    # the pinned LLVM 21.1.8 toolchain's ld.lld links against, and its newer
    # glibc's default _POSIX_C_SOURCE/_XOPEN_SOURCE collide with CPython
    # 3.14's pyconfig.h under -Werror. Both are upstream compatibility gaps
    # in dependencies this tree doesn't control (toolchains_llvm's LLVM
    # build, dds's python/converters.cpp), not bugs in this tree, so the fix
    # here is to stop floating onto whatever Ubuntu release GitHub renames
    # "latest" to next, rather than chase each incompatibility as it lands.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The LLVM toolchain extracts to ~4 GB and dds is built from source on
      # every run, so the runner's default free space is not comfortable.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build
        run: bazelisk build --verbose_failures //...

      - name: Test
        run: bazelisk test --verbose_failures --test_output=errors //...

      # The optimised build (-c opt plus -DNDEBUG). Its own step rather than
      # folded into the two above: an optimised build of this tree is a
      # different compilation, and nothing else here exercises --config=opt.
      # python/tests/ci_belief_evaluation_opt_test.py guards that these two
      # lines keep naming this module.
      - name: Build belief_evaluation (optimised)
        run: bazelisk build --config=opt --verbose_failures //src/belief_evaluation

      - name: Test belief_evaluation (optimised)
        run: bazelisk test --config=opt --verbose_failures --test_output=errors //tests/belief_evaluation/...

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bazel-testlogs-linux
          path: bazel-testlogs/**
          if-no-files-found: ignore
